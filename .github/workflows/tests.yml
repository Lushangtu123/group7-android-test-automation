name: Local checks

# Framework and console checks only. Real Android tests need the emulator,
# signed-in apps and Appium, so they are never run here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Checksum manifest
        run: shasum -a 256 -c --quiet MANIFEST.sha256
      - name: Console tests
        run: python -m unittest discover -s tests -v
      - name: Engine tests
        run: PYTHONPATH=engine python -m unittest discover -s engine/tests
      - name: Browser view-logic tests
        run: node --test tests/view_logic.test.mjs
